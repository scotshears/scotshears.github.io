<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Overhead</title>
<meta name="description" content="See what's flying over you tonight.">
<meta name="theme-color" content="#03050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overhead">
<meta property="og:type" content="website">
<meta property="og:title" content="Overhead">
<meta property="og:description" content="See what's flying over you tonight.">
<meta property="og:image" content="https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050b; --ink:#f5f0e6; --muted:rgba(245,240,230,.66); --faint:rgba(245,240,230,.42);
  --gold:#f2b84b; --gold2:#ffd88a; --teal:#6ff0d6; --line:rgba(255,255,255,.09);
  --glass:rgba(13,17,29,.56);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.22,1.18,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity 2s ease}
#stage.ready canvas{opacity:1}
.shadeTop{position:fixed;left:0;right:0;top:0;height:120px;pointer-events:none;z-index:2;
  background:linear-gradient(0deg,rgba(3,5,11,0),rgba(3,5,11,.55))}
#probe{position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

/* header: small and out of the way */
.top{position:fixed;z-index:5;top:calc(var(--safeT) + 12px);left:16px;right:16px;display:flex;
  justify-content:space-between;align-items:center;gap:12px;pointer-events:none;
  opacity:0;transform:translateY(-10px);transition:opacity 1.2s var(--ease) .3s,transform 1.2s var(--ease) .3s}
.ready .top{opacity:1;transform:none}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;line-height:1;letter-spacing:.2px}
.brand h1 em{color:var(--gold);font-style:italic}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 9px 7px 12px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;transition:border-color .4s}
.pill .sw{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.18);position:relative;transition:background .4s}
.pill .sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .45s var(--spring)}
.pill.on{border-color:rgba(242,184,75,.4)}
.pill.on .sw{background:var(--gold)}
.pill.on .sw::after{transform:translateX(12px)}

/* bottom sheet: peek / half / full */
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  height:calc(100% - var(--safeT) - 64px);display:flex;flex-direction:column;
  border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,rgba(22,26,42,.82),rgba(8,10,19,.92));
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,.1);border-bottom:0;
  box-shadow:0 -20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translate3d(0,110%,0);transition:transform .62s var(--spring);will-change:transform}
.sheet.drag{transition:none}
.handle{flex:none;padding:9px 0 5px;touch-action:none;cursor:grab}
.handle i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:4px 18px 14px;touch-action:none;cursor:pointer;min-height:66px}
.bt{flex:1;min-width:0}
.be{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--gold);text-transform:uppercase}
.bm{font-size:18px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.bs{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nowchip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;font-size:14px;font-weight:800;
  background:rgba(111,240,214,.1);border:1px solid rgba(111,240,214,.32);color:#c9fff3;white-space:nowrap;transition:transform .2s var(--ease)}
.nowchip:active{transform:scale(.95)}
.nowchip i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:breathe 2.4s ease-in-out infinite}
.nowchip.off{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--muted)}
.nowchip.off i{background:var(--faint);box-shadow:none;animation:none}
@keyframes breathe{50%{opacity:.35}}
.detail{flex:none;padding:2px 22px 18px;transition:opacity .35s ease}
.sheet.full .detail{display:none}
.lists{flex:1;min-height:0;display:none;flex-direction:column}
.sheet.full .lists{display:flex;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.swap{opacity:0}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;letter-spacing:2.4px;
  font-weight:800;color:var(--gold);text-transform:uppercase}
.chip{font-size:13px;letter-spacing:.2px;text-transform:none;font-weight:700;padding:5px 11px;border-radius:999px;
  background:rgba(242,184,75,.13);color:var(--gold2);border:1px solid rgba(242,184,75,.3);white-space:nowrap}
.chip.faint{background:rgba(200,215,255,.08);color:#d9e2ff;border-color:rgba(200,215,255,.22)}
.chip.vfaint{background:transparent;color:var(--muted);border-color:rgba(255,255,255,.16)}
.name{font-size:23px;font-weight:800;margin-top:8px;letter-spacing:-.2px;line-height:1.2}
.timerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.time{font-family:'Instrument Serif',serif;font-size:66px;line-height:.95;letter-spacing:-1.5px}
.time small{font-family:Manrope,sans-serif;font-size:18px;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:0}
.when{text-align:right;padding-bottom:8px}
.when .d{font-size:15px;color:var(--muted);font-weight:600}
.when .c{font-size:18px;font-weight:800;margin-top:3px}
.c.now{color:var(--gold2);display:inline-flex;align-items:center;gap:8px}
.c.now::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,184,75,.7)}80%,100%{box-shadow:0 0 0 12px rgba(242,184,75,0)}}
.look{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:18px;font-weight:700;line-height:1.3}
.compass{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.14);position:relative;
  background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.01))}
.compass b{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.5px}
.compass svg{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.path{font-size:16px;color:var(--muted);margin-top:10px;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:52px;border-radius:17px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-size:16px;font-weight:800;text-align:center;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#f7c865,#e2a138);color:#1d1406;border:none;box-shadow:0 10px 30px rgba(226,161,56,.22)}
.btn.slim{flex:0 0 auto;padding:0 20px}
.empty{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.5}
.skel{height:14px;border-radius:7px;margin-top:12px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.tabs{flex:none;display:flex;gap:6px;margin:2px 16px 8px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);touch-action:none}
.tabs button{flex:1;height:42px;border-radius:12px;font-size:15px;font-weight:800;color:var(--muted);text-align:center;transition:background .35s var(--ease),color .35s}
.tabs button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.tabs b{color:var(--teal);margin-left:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px calc(var(--safeB) + 16px)}
.head{padding:8px 10px 14px}
.head .big{font-family:'Instrument Serif',serif;font-size:60px;line-height:.95}
.head .big.teal{color:#c9fff3}
.head .lead{font-size:18px;font-weight:700;line-height:1.4;margin-top:2px}
.head .lead em{font-style:normal;color:var(--gold2)}
.head .note{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.45}
.head .mix{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;padding:15px 10px;border-top:1px solid var(--line);
  border-radius:16px;transition:background .25s;width:100%;text-align:left}
.row.now{grid-template-columns:14px 1fr auto}
.row:active{background:rgba(255,255,255,.06)}
.row .t{font-family:'Instrument Serif',serif;font-size:32px;line-height:.9}
.row .t small{display:block;white-space:nowrap;font-family:Manrope,sans-serif;font-size:12px;color:var(--faint);font-weight:700;margin-top:6px;letter-spacing:.3px}
.row .n{font-weight:800;font-size:17px;line-height:1.25}
.row .l{font-size:15px;color:var(--muted);margin-top:3px;line-height:1.35}
.row .chip{font-size:12px;padding:4px 9px}
.row.live .t{color:var(--gold2)}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.row .dot.dim{opacity:.5;box-shadow:none}
.none{color:var(--muted);padding:18px 10px;font-size:16px;line-height:1.5}

/* labels */
.lbl{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--gold2);
  text-shadow:0 1px 10px rgba(0,0,0,.9),0 0 2px #000;white-space:nowrap;opacity:0;transition:opacity .4s}
.lbl.on{opacity:1}
.lbl.you{color:#fff;font-weight:700}

/* loader */
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 55%,#0d1630 0%,#03050b 65%);transition:opacity 1.4s ease,visibility 1.4s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld{text-align:center}
.ld h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:64px;line-height:1}
.ld h1 em{color:var(--gold)}
.ld p{margin-top:14px;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.orbit{width:120px;height:120px;margin:0 auto 26px;position:relative}
.orbit::before{content:"";position:absolute;inset:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#2b4a8a,#0b1530 70%);box-shadow:0 0 40px rgba(80,140,255,.25)}
.orbit i{position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.1);animation:spin 3.2s linear infinite}
.orbit i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:var(--gold2);box-shadow:0 0 14px 3px rgba(255,216,138,.6)}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:900px){
  .sheet{left:24px;right:auto;margin:0;width:430px;height:calc(100% - var(--safeT) - 84px)}
  .top{left:28px;right:28px;top:calc(var(--safeT) + 22px)}
  .brand h1{font-size:34px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="shadeTop"></div>
<div id="probe"></div>

<div class="top">
  <div class="brand"><h1>Over<em>head</em></h1></div>
  <button class="pill" id="slBtn" aria-pressed="false"><span>Starlink</span><span class="sw"></span></button>
</div>

<div class="lbl" id="lblIss">Space Station</div>
<div class="lbl" id="lblSel"></div>
<div class="lbl you" id="lblYou">You</div>

<section class="sheet" id="sheet" aria-label="Overhead">
  <div class="handle" id="handle"><i></i></div>
  <div class="bar" id="bar">
    <div class="bt"><div class="be" id="barEye">Next over you</div><div class="bm" id="barMain">Finding where you are</div><div class="bs" id="barSub">&nbsp;</div></div>
    <button class="nowchip off" id="nowChip"><i></i><span id="nowChipTxt">Right now</span></button>
  </div>
  <div class="detail" id="detail"></div>
  <div class="lists" id="lists">
    <div class="tabs" id="tabs"><button data-tab="tonight" class="on">Tonight</button><button data-tab="now">Right now<b id="tabN"></b></button></div>
    <div class="scroll" id="scroll"></div>
  </div>
</section>

<div id="loader"><div class="ld"><div class="orbit"><i></i></div><h1>Over<em>head</em></h1><p id="ldMsg">Finding what's above you</p></div></div>

/* sharp detail patch: NASA GIBS tiles (Blue Marble day, Black Marble night) for the area you are zoomed into */
const GIBS = {
  day: (z, r, c) => `https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/BlueMarble_ShadedRelief_Bathymetry/default/2004-08-01/500m/${z}/${r}/${c}.jpeg`,
  night: (z, r, c) => `https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/VIIRS_Black_Marble/default/2016-01-01/500m/${z}/${r}/${c}.png`
};
const PATCH_N = 4, TILE = 512;
const patch = { mesh: null, key: '', busy: false, ver: 0, fade: 0, want: 0 };
function makeCanvas(){ const c = document.createElement('canvas'); c.width = c.height = PATCH_N*TILE; return c; }
function canvasTex(c){ const t = new THREE.CanvasTexture(c); return prep(t); }
function patchWanted(){
  const d = camera.position.length();
  if (d > 2.3) return null;
  const halfVis = (d - 1)*0.42/D2R;
  let z = 7; while (z > 4 && 288/Math.pow(2, z) < 0.62*halfVis) z--;
  const deg = 288/Math.pow(2, z), cols = Math.round(360/deg), rows = Math.round(180/deg);
  const p = camera.position.clone().normalize(), lat = Math.asin(p.y)/D2R, lon = Math.atan2(-p.z, p.x)/D2R;
  const c0 = Math.floor((lon + 180)/deg) - 1, r0 = Math.max(0, Math.min(rows - PATCH_N, Math.floor((90 - lat)/deg) - 1));
  return { z, deg, cols, rows, c0, r0, key: `${z}:${r0}:${c0}`, lat, lon };
}
async function buildPatch(w){
  patch.busy = true; const ver = ++patch.ver;
  const center = ll2v(90 - (w.r0 + PATCH_N/2)*w.deg, (w.c0 + PATCH_N/2)*w.deg - 180), sd = center.dot(sun.value);
  const needDay = sd > -0.35, needNight = sd < 0.35;
  const dayC = makeCanvas(), nightC = makeCanvas();
  const jobs = [];
  const draw = (cv, url, x, y) => new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.decoding = 'async';
    im.onload = () => { cv.getContext('2d').drawImage(im, x, y, TILE, TILE); res(true); };
    im.onerror = () => res(false); im.src = url;
  });
  for (let j = 0; j < PATCH_N; j++) for (let i = 0; i < PATCH_N; i++){
    const r = w.r0 + j, c = ((w.c0 + i) % w.cols + w.cols) % w.cols;
    if (needDay) jobs.push(draw(dayC, GIBS.day(w.z, r, c), i*TILE, j*TILE));
    if (needNight) jobs.push(draw(nightC, GIBS.night(w.z, r, c), i*TILE, j*TILE));
  }
  const ok = (await Promise.all(jobs)).filter(Boolean).length;
  patch.busy = false;
  if (ver !== patch.ver || !ok) return;
  if (!needDay){ const g = dayC.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, dayC.width, dayC.height); }
  const span = PATCH_N*w.deg*D2R;
  const geo = new THREE.SphereGeometry(1.0004, 96, 96, (w.c0*w.deg)*D2R, span, (w.r0*w.deg)*D2R, span);
  const mat = new THREE.ShaderMaterial({
    uniforms: { dayMap: { value: canvasTex(dayC) }, nightMap: { value: needNight ? canvasTex(nightC) : blank }, specMap: { value: blank },
      sunDir: sun, useSpec: { value: 0 }, opacity: { value: 0 }, edge: { value: 0.07 }, nightK: { value: 1.5 }, nightP: { value: 2.2 } },
    vertexShader: EARTH_VERT, fragmentShader: EARTH_FRAG, transparent: true, depthWrite: false
  });
  const m = new THREE.Mesh(geo, mat); m.renderOrder = 1;
  if (patch.mesh){ const old = patch.mesh; scene.remove(old); old.geometry.dispose(); old.material.uniforms.dayMap.value.dispose(); if (old.material.uniforms.nightMap.value !== blank) old.material.uniforms.nightMap.value.dispose(); old.material.dispose(); }
  patch.mesh = m; patch.fade = 0; scene.add(m);
  texInfo.detail = `${PATCH_N*TILE}px tiles, level ${w.z}`;
}
let idleSince = 0;
function stepPatch(now){
  const w = patchWanted();
  if (patch.mesh){
    patch.fade += ((w ? 1 : 0) - patch.fade)*0.08;
    patch.mesh.material.uniforms.opacity.value = patch.fade;
    patch.mesh.visible = patch.fade > 0.01;
  }
  if (!w || patch.busy || fly || dragging || now - idleSince < 350) return;
  if (w.key !== patch.key){ patch.key = w.key; buildPatch(w); }
}

      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 sunDir; varying vec3 vNv; varying vec3 vNw;
    void main(){ float f = clamp(-vNv.z * 2.55, 0., 1.); float g = pow(f, 3.2);
      float d = dot(normalize(-vNw), sunDir);

function pointMat(alpha){

    uniforms: { pr: { value: renderer.getPixelRatio() }, alpha: { value: alpha } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

    fragmentShader: `varying vec3 vC; uniform float alpha;

let mainGeo, mainPrev, mainNext, mainCur, mainT0 = 0;
let slGeo, slPts, slPrev, slNext, slCur, slT0 = 0, slHasData = false;
const COL = { base: [0.62,0.70,0.86], gold: [1.0,0.74,0.30], iss: [1.0,0.86,0.55] };
function buildMain(n){
  mainCur = new Float32Array(n*3); mainPrev = new Float32Array(n*3); mainNext = new Float32Array(n*3);
  mainGeo = new THREE.BufferGeometry();
  mainGeo.setAttribute('position', new THREE.BufferAttribute(mainCur, 3).setUsage(THREE.DynamicDrawUsage));
  mainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n*3), 3));
  mainGeo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(n), 1));
  const pts = new THREE.Points(mainGeo, pointMat(1.0)); pts.frustumCulled = false; pts.renderOrder = 3;
  scene.add(pts);
  recolor();
}
function recolor(){
  if (!mainGeo) return;
  const c = mainGeo.attributes.color.array, s = mainGeo.attributes.size.array;
  const hot = new Set(curated().filter(p => p.ref !== 'a').map(p => p.idx));
  const hotTrain = new Set(state.passes.filter(p => p.kind === 'train').map(p => p.train));
  state.sats.forEach((sat, i) => {
    let col = COL.base, size = 4.2;
    if (sat.kind === 'train'){ col = hotTrain.has(sat.train) ? COL.gold : [0.75,0.82,1.0]; size = 4.6; }
    else if (sat.kind === 'iss'){ col = COL.iss; size = 12; }
    else if (hot.has(i)){ col = COL.gold; size = 8; }
    if (state.sel && state.sel.t === 'm' && state.sel.i === i) size *= 1.5;
    c.set(col, i*3); s[i] = size;
  });
  mainGeo.attributes.color.needsUpdate = true; mainGeo.attributes.size.needsUpdate = true;
}
function buildSl(n){
  slCur = new Float32Array(n*3); slPrev = new Float32Array(n*3); slNext = new Float32Array(n*3);
  slGeo = new THREE.BufferGeometry();

  const col = new Float32Array(n*3), sz = new Float32Array(n);

/* tracked extra satellites (the ones up right now, on tonight's list, or selected) */
const trk = { prev: new Map(), next: new Map(), cur: new Map(), t0: 0 };
function takeTrk(ids, pos){
  const now = performance.now(), next = new Map();
  ids.forEach((id, k) => next.set(id, [pos[k*3], pos[k*3+1], pos[k*3+2]]));
  trk.prev = new Map(); trk.cur.forEach((v, k) => trk.prev.set(k, v.slice()));
  trk.next = next; trk.t0 = now;
}
function stepTrk(now){
  const k = Math.min(1, (now - trk.t0)/500), cur = new Map();
  trk.next.forEach((n, id) => {
    const p = trk.prev.get(id);
    cur.set(id, p && (p[0] || p[1]) ? [p[0] + (n[0]-p[0])*k, p[1] + (n[1]-p[1])*k, p[2] + (n[2]-p[2])*k] : n);
  });
  trk.cur = cur;
}
// "up right now" glow (teal)
const NOWCAP = 4000;
const nowGeo = new THREE.BufferGeometry();
nowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NOWCAP*3), 3).setUsage(THREE.DynamicDrawUsage));
nowGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(NOWCAP*3), 3).setUsage(THREE.DynamicDrawUsage));
nowGeo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(NOWCAP), 1).setUsage(THREE.DynamicDrawUsage));
nowGeo.setDrawRange(0, 0);
const nowPts = new THREE.Points(nowGeo, pointMat(1.0)); nowPts.frustumCulled = false; nowPts.renderOrder = 4; scene.add(nowPts);
function posOf(t, i){
  if (t === 'm') return mainCur ? [mainCur[i*3], mainCur[i*3+1], mainCur[i*3+2]] : null;
  return trk.cur.get(i) || null;
}
function stepNow(){
  const list = (state.now && state.now.list) || [];
  const P = nowGeo.attributes.position.array, C = nowGeo.attributes.color.array, S = nowGeo.attributes.size.array;
  let n = 0;
  for (const o of list){
    if (n >= NOWCAP) break;
    const p = posOf(o.t, o.i); if (!p) continue;
    P[n*3] = p[0]; P[n*3+1] = p[1]; P[n*3+2] = p[2];
    const b = o.lbl === 'Very faint' ? .55 : o.lbl === 'Faint' ? .8 : 1;
    C[n*3] = .38*b; C[n*3+1] = .96*b; C[n*3+2] = .84*b;
    S[n] = o.lbl === 'Very faint' ? 6 : o.lbl === 'Faint' ? 7.5 : 10;
    n++;
  }
  nowGeo.setDrawRange(0, n);
  nowGeo.attributes.position.needsUpdate = nowGeo.attributes.color.needsUpdate = nowGeo.attributes.size.needsUpdate = true;
}

/* ---------- camera fly ---------- */
let fly = null, dragging = false;
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
function flyTo(dir, dist, dur = 2400){
  fly = { q0: camera.position.clone().normalize(), q1: dir.clone().normalize(), d0: camera.position.length(), d1: dist, t0: performance.now(), dur };
  controls.enabled = false; controls.autoRotate = false;
}
function stepFly(now){
  if (!fly) return;
  const k = Math.min(1, (now - fly.t0)/fly.dur), e = ease(k);
  const a = Math.acos(Math.min(1, Math.max(-1, fly.q0.dot(fly.q1))));
  const v = a < 1e-4 ? fly.q1.clone()
    : fly.q0.clone().multiplyScalar(Math.sin((1-e)*a)/Math.sin(a)).add(fly.q1.clone().multiplyScalar(Math.sin(e*a)/Math.sin(a)));
  camera.position.copy(v.normalize().multiplyScalar(fly.d0 + (fly.d1 - fly.d0)*e + Math.sin(Math.PI*e)*Math.min(0.6, a*0.35)));
  camera.lookAt(0,0,0);
  if (k >= 1){ fly = null; controls.enabled = true; controls.update(); idleSince = performance.now(); }
}
camera.position.copy(ll2v(18, -40, 1).multiplyScalar(4));

/* ---------- worker ---------- */
function startWorker(omm){
  const w = new Worker(URL.createObjectURL(new Blob([$('#workerSrc').textContent], { type: 'text/javascript' })));
  state.worker = w;
  w.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready'){
      state.sats = m.sats; state.slCount = m.slCount; state.trains = m.trains;
      buildMain(m.sats.length); buildSl(m.slCount);
      if (!m.slCount) $('#slBtn').style.display = 'none';
      console.info('overhead catalog', JSON.stringify({ sats: m.actCount + m.sats.length, maxId: m.maxId, trains: m.trains }));
      if (state.obs) w.postMessage({ type: 'obs', ...state.obs });
      maybeReveal();
    } else if (m.type === 'pos'){
      const now = performance.now();
      if (m.main){
        if (!mainT0){ mainCur.set(m.main); mainPrev.set(m.main); } else mainPrev.set(mainCur);
        mainNext = m.main; mainT0 = now;
      }
      if (m.trk) takeTrk(Array.from(m.trk), m.trkPos);
      if (m.sl){
        if (!slHasData){ slCur.set(m.sl); slPrev.set(m.sl); slHasData = true; } else slPrev.set(slCur);
        slNext = m.sl; slT0 = now;
      }
    } else if (m.type === 'passes'){
      state.passes = m.passes; state.passesReady = true; refresh();
    } else if (m.type === 'now'){
      state.now = m; refreshNow();
    } else if (m.type === 'counting'){
      state.counting = true; refreshLists();
    } else if (m.type === 'evening'){
      state.counting = false; state.evening = m; refresh();
    } else if (m.type === 'timing'){
      console.info('overhead timing ms', m);
    } else if (m.type === 'path'){
      if (state.sel && state.sel.t === m.t && state.sel.i === m.idx) setPath(m.pts);
    }
  };
  w.postMessage({ type: "init", ...omm, off: OFF });
}

/* ---------- data (CelesTrak allows one download per group every 2 hours, so keep a copy) ---------- */
async function getOMM(group, alt){
  const url = alt || `https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=csv`;
  let cache = null, hit = null, age = Infinity;
  try { cache = await caches.open('overhead-omm-v1'); hit = await cache.match(url); if (hit) age = Date.now() - Number(hit.headers.get('x-saved') || 0); } catch (e) {}
  if (hit && age < 2*3600e3) return hit.text();
  try {
    const r = await fetch(url, { cache: 'no-store' }); const t = await r.text();
    if (r.ok && t.startsWith('OBJECT_NAME') && t.indexOf('\n') > 0){
      try { if (cache) await cache.put(url, new Response(t, { headers: { 'x-saved': String(Date.now()), 'content-type': 'text/plain' } })); } catch (e) {}
      return t;
    }
  } catch (e) {}
  return hit ? hit.text() : '';
}
async function loadData(){
  const [visual, stations, active0, recent] = await Promise.all([getOMM('visual'), getOMM('stations'), getOMM('active'), getOMM('last-30-days')]);
  let active = active0;
  if (!active) active = await getOMM('starlink');
  if (!active) active = await getOMM('starlink', 'https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=csv');
  if (!visual && !stations){ state.dataError = true; refresh(); maybeReveal(true); return; }
  startWorker({ visual, stations, active, recent });
}

/* ---------- location ---------- */
let pendingFly = false;
function askLocation(){
  if (!navigator.geolocation){ state.locError = 'none'; refresh(); return; }
  state.locating = true; refresh();
  navigator.geolocation.getCurrentPosition(p => {
    state.locating = false; state.locError = null;
    state.obs = { lat: p.coords.latitude, lon: p.coords.longitude, alt: p.coords.altitude || 0 };
    const v = ll2v(state.obs.lat, state.obs.lon, 1.0006);
    home.position.copy(v); home.lookAt(v.clone().multiplyScalar(2)); home.visible = true;
    if (revealed) flyTo(v, flyDist(), 2800); else pendingFly = true;
    if (state.worker && state.sats.length) state.worker.postMessage({ type: 'obs', ...state.obs });
    refresh();
  }, err => { state.locating = false; state.locError = err.code === 1 ? 'denied' : 'fail'; refresh(); },
  { enableHighAccuracy: false, timeout: 15000, maximumAge: 10*60000 });
}

/* ---------- words ---------- */
const DIRS = ['North','Northeast','East','Southeast','South','Southwest','West','Northwest'];
const dir = az => DIRS[Math.round(az/45) % 8];
const height = el => el < 25 ? 'low in the sky' : el < 55 ? 'halfway up' : 'high overhead';
const climb = el => el < 25 ? 'stays low' : el < 55 ? 'climbs halfway up' : 'passes high overhead';
const tcase = n => n.split(/\s+/).map(w => w.split('-').map(x => (/\d/.test(x) || /^[A-Z]{2,4}$/.test(x)) ? x : x.charAt(0) + x.slice(1).toLowerCase()).join('-')).join(' ');
function friendly(s){
  if (!s) return 'Satellite';
  if (s.kind === 'iss') return 'International Space Station';
  if (s.kind === 'css') return 'Chinese Space Station';
  if (s.kind === 'hst') return 'Hubble Space Telescope';
  if (s.kind === 'train') return 'Starlink train (string of lights)';
  if (s.kind === 'rb') return 'Old rocket stage';
  const n = (s.name || '').replace(/\(.*?\)|\[.*?\]/g, '').replace(/\bDEB\b/, '').replace(/-(?=\d)/g, ' ').trim();
  return tcase(n) || 'Satellite';
}
function blurb(s){
  switch (s.kind){
    case 'iss': return 'Astronauts live on board, about 250 miles up. The brightest thing that moves across the night sky.';
    case 'css': return "China's space station, with astronauts on board. Bright and steady, it never blinks.";

function placeLabel(el, p, show, dy = -22){
  if (!show || !inFront(p)){ el.classList.remove('on'); return; }
  const s = toScreen(p), hw = el.offsetWidth/2 + 10, x = Math.max(hw, Math.min(window.innerWidth - hw, s.x));
  el.style.transform = `translate(${x.toFixed(1)}px, ${(s.y + dy).toFixed(1)}px) translate(-50%, -50%)`;
  el.classList.add('on');
}

/* ---------- reveal ---------- */
let revealed = false, texturesDone = false;
function maybeReveal(force){
  if (revealed || !(force || (texturesDone && state.sats.length))) return;
  revealed = true;
  document.body.classList.add('ready'); $('#stage').classList.add('ready');
  $('#loader').classList.add('hide');
  sheetLayout();
  setTimeout(() => setSnap('peek'), 400);
  if (pendingFly && state.obs){ pendingFly = false; flyTo(ll2v(state.obs.lat, state.obs.lon), flyDist(), 3000); }
}
setTimeout(() => { if (!revealed && texturesDone) maybeReveal(true); }, 12000);

/* ---------- loop ---------- */
let raf = 0, lastSun = 0;
controls.addEventListener('start', () => { dragging = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { dragging = false; idleSince = performance.now(); });
controls.addEventListener('change', () => { idleSince = performance.now(); });
function frame(now){
  raf = requestAnimationFrame(frame);
  if (now - lastSun > 1000){ sun.value.copy(sunVec(nowMs())); lastSun = now; }
  if (mainCur && mainT0){
    const k = Math.min(1, (now - mainT0)/500);
    for (let i = 0; i < mainCur.length; i++) mainCur[i] = mainPrev[i] + (mainNext[i] - mainPrev[i])*k;
    mainGeo.attributes.position.needsUpdate = true;
  }
  stepTrk(now); stepNow();
  if (slPts){
    slAlpha += ((state.slOn && slHasData ? 0.55 : 0) - slAlpha)*0.08;
    slPts.material.uniforms.alpha.value = slAlpha; slPts.visible = slAlpha > 0.01;
    if (slPts.visible && slT0){
      const k = Math.min(1, (now - slT0)/1000);
      for (let i = 0; i < slCur.length; i++) slCur[i] = slPrev[i] + (slNext[i] - slPrev[i])*k;
      slGeo.attributes.position.needsUpdate = true;
    }
  }
  const dist = camera.position.length();
  controls.rotateSpeed = 0.06 + 0.36*Math.min(1, (dist - 1)/(baseDist - 1));
  controls.zoomSpeed = 0.5 + 0.5*Math.min(1, (dist - 1)/(baseDist - 1));
  stepFly(now);
  if (!fly) controls.update();
  stepPatch(now);

  const issI = state.sats.findIndex(s => s.kind === 'iss');
  if (issI >= 0 && mainT0){
    issRing.position.fromArray(mainCur, issI*3); issRing.visible = true;
    const sc = 0.04 + 0.006*Math.sin(now/500); issRing.scale.set(sc, sc, 1);
    placeLabel(lblIss, issRing.position, !(state.sel && state.sel.t === 'm' && state.sel.i === issI));
  }
  const sp = state.sel && posOf(state.sel.t, state.sel.i);
  if (sp){
    selRing.position.set(sp[0], sp[1], sp[2]); selRing.visible = true;
    const sc = 0.055 + 0.01*Math.sin(now/350); selRing.scale.set(sc, sc, 1);
    lblSel.textContent = friendly(state.sel.t === 'm' ? state.sats[state.sel.i] : state.sel.info);
    placeLabel(lblSel, selRing.position, true, -26);
  } else { selRing.visible = false; lblSel.classList.remove('on'); }
  if (pathLine.visible){ pathFade = Math.min(1, pathFade + 0.03); pathLine.material.opacity = pathFade; }
  if (home.visible){
    home.scale.setScalar(Math.max(0.0012, (dist - 1)*0.012 + 0.0006));
    const k = (now % 2200)/2200;
    pulse.scale.setScalar(1 + k*2.2); pulse.material.opacity = 0.8*(1 - k);
    placeLabel(lblYou, home.position, true, -24);
  }
  renderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ cancelAnimationFrame(raf); raf = 0; state.worker && state.worker.postMessage({ type: 'pause', on: true }); }
  else if (!raf){ state.worker && state.worker.postMessage({ type: 'pause', on: false }); raf = requestAnimationFrame(frame); }
});
window.addEventListener('resize', layout);
window.__overhead = { state, texInfo, ui, camera, controls, setSnap, select };

layout();
refresh();
raf = requestAnimationFrame(frame);
loadEarth();
loadData();
askLocation();
</script>
</body>
</html>
