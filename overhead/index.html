<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Overhead</title>
<meta name="description" content="See what's flying over you tonight.">
<meta name="theme-color" content="#03050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overhead">
<meta property="og:type" content="website">
<meta property="og:title" content="Overhead">
<meta property="og:description" content="See what's flying over you tonight.">
<meta property="og:image" content="https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2303050b'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23f2b84b' stroke-width='3'/%3E%3Ccircle cx='46' cy='20' r='5' fill='%23ffd88a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050b; --ink:#f5f0e6; --muted:rgba(245,240,230,.66); --faint:rgba(245,240,230,.42);
  --gold:#f2b84b; --gold2:#ffd88a; --teal:#6ff0d6; --line:rgba(255,255,255,.09);
  --glass:rgba(13,17,29,.56);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.22,1.18,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity 2s ease}
#stage.ready canvas{opacity:1}
.shadeTop{position:fixed;left:0;right:0;top:0;height:120px;pointer-events:none;z-index:2;
  background:linear-gradient(0deg,rgba(3,5,11,0),rgba(3,5,11,.55))}
#probe{position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

/* header: small and out of the way */
.top{position:fixed;z-index:5;top:calc(var(--safeT) + 12px);left:16px;right:16px;display:flex;
  justify-content:space-between;align-items:center;gap:12px;pointer-events:none;
  opacity:0;transform:translateY(-10px);transition:opacity 1.2s var(--ease) .3s,transform 1.2s var(--ease) .3s}
.ready .top{opacity:1;transform:none}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;line-height:1;letter-spacing:.2px}
.brand h1 em{color:var(--gold);font-style:italic}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 9px 7px 12px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;transition:border-color .4s}
.pill .sw{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.18);position:relative;transition:background .4s}
.pill .sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .45s var(--spring)}
.pill.on{border-color:rgba(242,184,75,.4)}
.pill.on .sw{background:var(--gold)}
.pill.on .sw::after{transform:translateX(12px)}

/* bottom sheet: peek / half / full */
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  height:calc(100% - var(--safeT) - 64px);display:flex;flex-direction:column;
  border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,rgba(22,26,42,.82),rgba(8,10,19,.92));
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,.1);border-bottom:0;
  box-shadow:0 -20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translate3d(0,110%,0);transition:transform .62s var(--spring);will-change:transform}
.sheet.drag{transition:none}
.handle{flex:none;padding:9px 0 5px;touch-action:none;cursor:grab}
.handle i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:4px 18px 14px;touch-action:none;cursor:pointer;min-height:66px}
.bt{flex:1;min-width:0}
.be{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--gold);text-transform:uppercase}
.bm{font-size:18px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.bs{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nowchip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;font-size:14px;font-weight:800;
  background:rgba(111,240,214,.1);border:1px solid rgba(111,240,214,.32);color:#c9fff3;white-space:nowrap;transition:transform .2s var(--ease)}
.nowchip:active{transform:scale(.95)}
.nowchip i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:breathe 2.4s ease-in-out infinite}
.nowchip.off{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--muted)}
.nowchip.off i{background:var(--faint);box-shadow:none;animation:none}
@keyframes breathe{50%{opacity:.35}}
.detail{flex:none;padding:2px 22px 18px;transition:opacity .35s ease}
.sheet.full .detail{display:none}
.lists{flex:1;min-height:0;display:none;flex-direction:column}
.sheet.full .lists{display:flex;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.swap{opacity:0}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;letter-spacing:2.4px;
  font-weight:800;color:var(--gold);text-transform:uppercase}
.chip{font-size:13px;letter-spacing:.2px;text-transform:none;font-weight:700;padding:5px 11px;border-radius:999px;
  background:rgba(242,184,75,.13);color:var(--gold2);border:1px solid rgba(242,184,75,.3);white-space:nowrap}
.chip.faint{background:rgba(200,215,255,.08);color:#d9e2ff;border-color:rgba(200,215,255,.22)}
.chip.vfaint{background:transparent;color:var(--muted);border-color:rgba(255,255,255,.16)}
.name{font-size:23px;font-weight:800;margin-top:8px;letter-spacing:-.2px;line-height:1.2}
.timerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.time{font-family:'Instrument Serif',serif;font-size:66px;line-height:.95;letter-spacing:-1.5px}
.time small{font-family:Manrope,sans-serif;font-size:18px;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:0}
.when{text-align:right;padding-bottom:8px}
.when .d{font-size:15px;color:var(--muted);font-weight:600}
.when .c{font-size:18px;font-weight:800;margin-top:3px}
.c.now{color:var(--gold2);display:inline-flex;align-items:center;gap:8px}
.c.now::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,184,75,.7)}80%,100%{box-shadow:0 0 0 12px rgba(242,184,75,0)}}
.look{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:18px;font-weight:700;line-height:1.3}
.compass{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.14);position:relative;
  background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.01))}
.compass b{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.5px}
.compass svg{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.path{font-size:16px;color:var(--muted);margin-top:10px;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:52px;border-radius:17px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-size:16px;font-weight:800;text-align:center;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#f7c865,#e2a138);color:#1d1406;border:none;box-shadow:0 10px 30px rgba(226,161,56,.22)}
.btn.slim{flex:0 0 auto;padding:0 20px}
.empty{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.5}
.skel{height:14px;border-radius:7px;margin-top:12px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.tabs{flex:none;display:flex;gap:6px;margin:2px 16px 8px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);touch-action:none}
.tabs button{flex:1;height:42px;border-radius:12px;font-size:15px;font-weight:800;color:var(--muted);text-align:center;transition:background .35s var(--ease),color .35s}
.tabs button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.tabs b{color:var(--teal);margin-left:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px calc(var(--safeB) + 16px)}
.head{padding:8px 10px 14px}
.head .big{font-family:'Instrument Serif',serif;font-size:60px;line-height:.95}
.head .big.teal{color:#c9fff3}
.head .lead{font-size:18px;font-weight:700;line-height:1.4;margin-top:2px}
.head .lead em{font-style:normal;color:var(--gold2)}
.head .note{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.45}
.head .mix{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;padding:15px 10px;border-top:1px solid var(--line);
  border-radius:16px;transition:background .25s;width:100%;text-align:left}
.row.now{grid-template-columns:14px 1fr auto}
.row:active{background:rgba(255,255,255,.06)}
.row .t{font-family:'Instrument Serif',serif;font-size:32px;line-height:.9}
.row .t small{display:block;white-space:nowrap;font-family:Manrope,sans-serif;font-size:12px;color:var(--faint);font-weight:700;margin-top:6px;letter-spacing:.3px}
.row .n{font-weight:800;font-size:17px;line-height:1.25}
.row .l{font-size:15px;color:var(--muted);margin-top:3px;line-height:1.35}
.row .chip{font-size:12px;padding:4px 9px}
.row.live .t{color:var(--gold2)}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.row .dot.dim{opacity:.5;box-shadow:none}
.none{color:var(--muted);padding:18px 10px;font-size:16px;line-height:1.5}

/* labels */
.lbl{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--gold2);
  text-shadow:0 1px 10px rgba(0,0,0,.9),0 0 2px #000;white-space:nowrap;opacity:0;transition:opacity .4s}
.lbl.on{opacity:1}
.lbl.you{color:#fff;font-weight:700}

/* loader */
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 55%,#0d1630 0%,#03050b 65%);transition:opacity 1.4s ease,visibility 1.4s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld{text-align:center}
.ld h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:64px;line-height:1}
.ld h1 em{color:var(--gold)}
.ld p{margin-top:14px;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.orbit{width:120px;height:120px;margin:0 auto 26px;position:relative}
.orbit::before{content:"";position:absolute;inset:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#2b4a8a,#0b1530 70%);box-shadow:0 0 40px rgba(80,140,255,.25)}
.orbit i{position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.1);animation:spin 3.2s linear infinite}
.orbit i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:var(--gold2);box-shadow:0 0 14px 3px rgba(255,216,138,.6)}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:900px){
  .sheet{left:24px;right:auto;margin:0;width:430px;height:calc(100% - var(--safeT) - 84px)}
  .top{left:28px;right:28px;top:calc(var(--safeT) + 22px)}
  .brand h1{font-size:34px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="shadeTop"></div>
<div id="probe"></div>

<div class="top">
  <div class="brand"><h1>Over<em>head</em></h1></div>
  <button class="pill" id="slBtn" aria-pressed="false"><span>Starlink</span><span class="sw"></span></button>
</div>

<div class="lbl" id="lblIss">Space Station</div>
<div class="lbl" id="lblSel"></div>
<div class="lbl you" id="lblYou">You</div>

<section class="sheet" id="sheet" aria-label="Overhead">
  <div class="handle" id="handle"><i></i></div>
  <div class="bar" id="bar">
    <div class="bt"><div class="be" id="barEye">Next over you</div><div class="bm" id="barMain">Finding where you are</div><div class="bs" id="barSub">&nbsp;</div></div>
    <button class="nowchip off" id="nowChip"><i></i><span id="nowChipTxt">Right now</span></button>
  </div>
  <div class="detail" id="detail"></div>
  <div class="lists" id="lists">
    <div class="tabs" id="tabs"><button data-tab="tonight" class="on">Tonight</button><button data-tab="now">Right now<b id="tabN"></b></button></div>
    <div class="scroll" id="scroll"></div>
  </div>
</section>

<div id="loader"><div class="ld"><div class="orbit"><i></i></div><h1>Over<em>head</em></h1><p id="ldMsg">Finding what's above you</p></div></div>

<script id="workerSrc" type="text/js-worker">
importScripts('https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js');
const S = self.satellite;
const RE = 6371, D2R = Math.PI/180, R2D = 180/Math.PI, DARK = Math.sin(-6*D2R);
let main = [], sl = [], trains = [], obs = null, slOn = false, paused = false, passTimer = null;
let OFF = 0; const nowMs = () => Date.now() + OFF;

function parse(txt){
  const L = (txt||'').split(/\r?\n/), out = [];
  for (let i = 0; i < L.length - 1; i++){
    const a = L[i], b = L[i+1];
    if (a.startsWith('1 ') && b.startsWith('2 ')){
      const prev = i > 0 ? L[i-1].trim() : '';
      const name = (prev && !prev.startsWith('1 ') && !prev.startsWith('2 ')) ? prev : '';
      const rec = S.twoline2satrec(a, b);
      if (rec && !rec.error) out.push({ name, l1: a, l2: b, rec, id: a.substring(2,7).trim() });
      i++;
    }
  }
  return out;
}
function yearOf(l1){ const yy = parseInt(l1.substring(9,11),10); return isNaN(yy) ? null : (yy < 57 ? 2000+yy : 1900+yy); }
function kindOf(s){
  if (s.id === '25544') return 'iss';
  if (/TIANHE/.test(s.name)) return 'css';
  if (/^HST\b/.test(s.name)) return 'hst';
  if (/R\/B/.test(s.name)) return 'rb';
  return 'sat';
}
function sunDir(t){
  const n = t/86400000 + 2440587.5 - 2451545;
  const L = (280.460 + 0.9856474*n)*D2R, g = (357.528 + 0.9856003*n)*D2R;
  const lam = L + (1.915*Math.sin(g) + 0.020*Math.sin(2*g))*D2R, eps = (23.439 - 4e-7*n)*D2R;
  return [Math.cos(lam), Math.cos(eps)*Math.sin(lam), Math.sin(eps)*Math.sin(lam)];
}
function lit(p, s){
  const d = p.x*s[0] + p.y*s[1] + p.z*s[2];
  if (d > 0) return true;
  return Math.hypot(p.x - d*s[0], p.y - d*s[1], p.z - d*s[2]) > RE;
}
function obsSunSin(s, g){
  const c = Math.cos(g), sn = Math.sin(g);
  const x = s[0]*c + s[1]*sn, y = -s[0]*sn + s[1]*c, z = s[2];
  return obs.up[0]*x + obs.up[1]*y + obs.up[2]*z;
}
function sample(rec, t){
  const d = new Date(t), pv = S.propagate(rec, d);
  if (!pv || !pv.position) return null;
  const g = S.gstime(d), ecf = S.eciToEcf(pv.position, g), la = S.ecfToLookAngles(obs.gd, ecf);
  return { t, el: la.elevation*R2D, az: ((la.azimuth*R2D)%360+360)%360, p: pv.position, g, rng: la.rangeSat };
}
function findPasses(rec, t0, t1, minPeak){
  const res = [];
  let t = t0;
  while (t < t1){
    const s = sample(rec, t);
    if (!s || s.el < 10){ t += (s ? skipMin(rec, s.p, s.g, 10) : 1)*60000; continue; }
    const pts = [];
    for (let u = t - 60000; u < t + 40*60000; u += 10000){
      const q = sample(rec, u);
      if (!q) break;
      if (q.el >= 10){ const sd = sunDir(u); q.vis = lit(q.p, sd) && obsSunSin(sd, q.g) < DARK; pts.push(q); }
      else if (pts.length) break;
    }
    if (!pts.length){ t += 60000; continue; }
    const v = pts.filter(q => q.vis);
    if (v.length){
      let pk = v[0]; for (const q of v) if (q.el > pk.el) pk = q;
      if (pk.el >= minPeak) res.push({ start: v[0].t, end: v[v.length-1].t, startAz: v[0].az, endAz: v[v.length-1].az,
        peakT: pk.t, peakEl: pk.el, peakAz: pk.az, peakRng: pk.rng });
    }
    t = pts[pts.length-1].t + 60000;
  }
  return res;
}
function findTrains(list){
  const yy = String(new Date(nowMs()).getUTCFullYear() % 100).padStart(2,'0'), groups = {};
  for (const s of list){ const k = s.l1.substring(9,14); if (k.startsWith(yy)) (groups[k] = groups[k] || []).push(s); }
  const out = [];
  for (const k in groups){
    const g = groups[k]; if (g.length < 10) continue;
    const mm = g.map(s => parseFloat(s.l2.substring(52,63))).sort((a,b) => a-b);
    if (mm[mm.length >> 1] < 15.45) continue; // already raised to working height: no longer a train
    out.push({ k, num: parseInt(k.substring(2),10), members: g });
  }
  out.sort((a,b) => b.num - a.num);
  return out.slice(0,3);
}
function toThree(p, g, arr, o){
  const c = Math.cos(g), s = Math.sin(g);
  const x = p.x*c + p.y*s, y = -p.x*s + p.y*c;
  arr[o] = x/RE; arr[o+1] = p.z/RE; arr[o+2] = -y/RE;
}
function positions(list, t){
  const d = new Date(t), g = S.gstime(d), arr = new Float32Array(list.length*3);
  for (let i = 0; i < list.length; i++){
    const pv = S.propagate(list[i].rec, d);
    if (pv && pv.position) toThree(pv.position, g, arr, i*3);
  }
  return arr;
}
function apoOf(rec){ const a = Math.cbrt(398600.4418/Math.pow(rec.no/60, 2)); return a*(1 + rec.ecco) - RE; }
function coneOf(rec, minEl){
  if (rec._cone == null || rec._coneEl !== minEl){
    const h = Math.max(150, apoOf(rec)), e = minEl*D2R;
    rec._cone = (Math.acos(Math.min(1, RE/(RE + h)*Math.cos(e))) - e)*R2D + 2; rec._coneEl = minEl;
    rec._rate = rec.no*R2D + 0.3;
  }
  return rec._cone;
}
// minutes we can safely jump ahead: the satellite is far outside the circle where it could be above minEl
function skipMin(rec, p, g, minEl){
  if (!p) return 1;
  const c = Math.cos(g), sn = Math.sin(g);
  const ux = obs.up[0]*c - obs.up[1]*sn, uy = obs.up[0]*sn + obs.up[1]*c, uz = obs.up[2];
  const ang = Math.acos(Math.max(-1, Math.min(1, (p.x*ux + p.y*uy + p.z*uz)/Math.hypot(p.x, p.y, p.z))))*R2D;
  const cone = coneOf(rec, minEl);
  return ang > cone ? Math.max(1, Math.floor((ang - cone)/rec._rate)) : 1;
}
// honest brightness: what a person can really spot

  }
};

function startWorker(tles){
  const w = new Worker(URL.createObjectURL(new Blob([$('#workerSrc').textContent], { type: 'text/javascript' })));
  state.worker = w;
  w.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready'){
      state.sats = m.sats; state.slCount = m.slCount; state.trains = m.trains;
      buildMain(m.sats.length); buildSl(m.slCount);
      if (!m.slCount) $('#slBtn').style.display = 'none';
      if (state.obs) w.postMessage({ type: 'obs', ...state.obs });
      maybeReveal();
    } else if (m.type === 'pos'){
      const now = performance.now();
      if (m.main){
        if (!mainT0){ mainCur.set(m.main); mainPrev.set(m.main); } else mainPrev.set(mainCur);
        mainNext = m.main; mainT0 = now;
      }
      if (m.trk) takeTrk(Array.from(m.trk), m.trkPos);
      if (m.sl){
        if (!slHasData){ slCur.set(m.sl); slPrev.set(m.sl); slHasData = true; } else slPrev.set(slCur);
        slNext = m.sl; slT0 = now;
      }
    } else if (m.type === 'passes'){
      state.passes = m.passes; state.passesReady = true; refresh();
    } else if (m.type === 'now'){
      state.now = m; refreshNow();
    } else if (m.type === 'counting'){
      state.counting = true; refreshLists();
    } else if (m.type === 'evening'){
      state.counting = false; state.evening = m; refresh();
    } else if (m.type === 'timing'){
      console.info('overhead timing ms', m);
    } else if (m.type === 'path'){
      if (state.sel && state.sel.t === m.t && state.sel.i === m.idx) setPath(m.pts);
    }
  };
  w.postMessage({ type: 'init', ...tles, off: OFF });
}

/* ---------- data (CelesTrak allows one download per group every 2 hours, so keep a copy) ---------- */
async function getTLE(group, alt){
  const url = alt || `https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle`;
  let cache = null, hit = null, age = Infinity;
  try { cache = await caches.open('overhead-tle-v1'); hit = await cache.match(url); if (hit) age = Date.now() - Number(hit.headers.get('x-saved') || 0); } catch (e) {}
  if (hit && age < 2*3600e3) return hit.text();
  try {
    const r = await fetch(url, { cache: 'no-store' }); const t = await r.text();
    if (r.ok && /^1 /m.test(t)){
      try { if (cache) await cache.put(url, new Response(t, { headers: { 'x-saved': String(Date.now()), 'content-type': 'text/plain' } })); } catch (e) {}
      return t;
    }
  } catch (e) {}
  return hit ? hit.text() : '';
}
async function loadData(){
  const [visual, stations, active0] = await Promise.all([getTLE('visual'), getTLE('stations'), getTLE('active')]);
  let active = active0;
  if (!active) active = await getTLE('starlink');
  if (!active) active = await getTLE('starlink', 'https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=tle');
  if (!visual && !stations){ state.dataError = true; refresh(); maybeReveal(true); return; }
  startWorker({ visual, stations, active });
}

const nextBright = () => brightList().sort((a,b) => a.start - b.start)[0];

/* ---------- sheet ---------- */
const sheet = $('#sheet'), bar = $('#bar'), detail = $('#detail');
const ui = { snap: 'peek', tab: 'tonight', y: 0, H: 0, safeB: 0 };
function snapY(s){
  const peek = $('#handle').offsetHeight + bar.offsetHeight + ui.safeB;
  if (s === 'peek') return ui.H - peek;
  if (s === 'half') return Math.max(0, ui.H - (peek + ui.detailH));
  return 0;
}
function measureDetail(){ if (!sheet.classList.contains('full')) ui.detailH = detail.offsetHeight; }
function applyY(y){ ui.y = y; sheet.style.transform = `translate3d(0,${y}px,0)`; }
function sheetLayout(){
  ui.H = sheet.offsetHeight; ui.safeB = $('#probe').offsetHeight; measureDetail();
  if (revealed) applyY(snapY(ui.snap));
}
function setSnap(s){
  ui.snap = s;
  sheet.classList.toggle('full', s === 'full');
  sheet.classList.remove('drag');
  if (s === 'full') refreshLists();
  requestAnimationFrame(() => { measureDetail(); applyY(snapY(s)); });
}
function openTab(tab){ ui.tab = tab; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); setSnap('full'); refreshLists(); $('#scroll').scrollTop = 0; }
// drag the handle, the bar or the tabs
let sd = null;
function sdStart(e){
  if (e.button > 0) return;
  sd = { y0: e.clientY, Y0: ui.y, t: performance.now(), hist: [[performance.now(), e.clientY]], moved: false, target: e.target };
  sheet.classList.add('drag');
}
window.addEventListener('pointermove', e => {
  if (!sd) return;
  const dy = e.clientY - sd.y0;
  if (Math.abs(dy) > 6) sd.moved = true;
  if (!sd.moved) return;
  const lo = 0, hi = snapY('peek');
  let y = sd.Y0 + dy;
  if (y < lo) y = lo - Math.sqrt(lo - y)*3; if (y > hi) y = hi + Math.sqrt(y - hi)*3;
  applyY(y);
  sd.hist.push([performance.now(), e.clientY]); if (sd.hist.length > 6) sd.hist.shift();
});
window.addEventListener('pointerup', e => {
  if (!sd) return;
  const s = sd; sd = null;
  if (!s.moved){
    sheet.classList.remove('drag');
    if (s.target.closest('#nowChip')) return openTab('now');
    if (s.target.closest('#tabs')){ const b = s.target.closest('button'); if (b) openTab(b.dataset.tab); return; }
    if (s.target.closest('#bar') || s.target.closest('#handle')) setSnap(ui.snap === 'peek' ? 'half' : 'peek');
    return;
  }
  const h = s.hist, a = h[0], b = h[h.length - 1], v = (b[1] - a[1])/Math.max(16, b[0] - a[0]);
  const order = ['full','half','peek'], ys = order.map(snapY);
  let target;
  if (v < -0.45){ const c = order.filter((o, i) => ys[i] < ui.y - 4); target = c.length ? c[c.length - 1] : 'full'; }
  else if (v > 0.45){ const c = order.filter((o, i) => ys[i] > ui.y + 4); target = c.length ? c[0] : 'peek'; }
  else { let bi = 0; ys.forEach((yy, i) => { if (Math.abs(yy - ui.y) < Math.abs(ys[bi] - ui.y)) bi = i; }); target = order[bi]; }
  if (target === 'full' && ui.snap !== 'full') sheet.classList.add('full');
  setSnap(target);
});
['#handle', '#bar', '#tabs'].forEach(sel => $(sel).addEventListener('pointerdown', sdStart));
// pull down on the top of a list to go back to the card
(function(){
  const sc = $('#scroll'); let y0 = null, top = false;
  sc.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; top = sc.scrollTop <= 0; }, { passive: true });
  sc.addEventListener('touchend', e => { if (y0 != null && top && e.changedTouches[0].clientY - y0 > 70) setSnap('half'); y0 = null; }, { passive: true });
})();

/* ---------- card + bar ---------- */
let detailKey = '';
function compassSvg(az){
  return `<div class="compass"><b>N</b><svg viewBox="0 0 46 46" style="transform:rotate(${az}deg)">
    <path d="M23 9 L28 25 L23 22 L18 25 Z" fill="#ffd88a"/><circle cx="23" cy="23" r="2.2" fill="#ffd88a" opacity=".6"/></svg></div>`;
}
function passBlock(p){
  const T = hm(p.start), u = until(p);
  return `<div class="timerow"><div class="time">${T.t}<small>${T.ap}</small></div>
      <div class="when"><div class="d">${dayWord(p.start)}</div><div class="c ${u.now ? 'now' : ''}" data-count>${u.txt}</div></div></div>
    <div class="look">${compassSvg(lookAz(p))}<div>${lookWords(p)}</div></div>
    <div class="path">${pathWords(p)}</div>`;
}
function selInfo(){
  const s = state.sel; if (!s) return null;
  const sat = s.t === 'm' ? state.sats[s.i] : s.info;
  const now = nowMs();
  const p = s.t === 'm'
    ? state.passes.find(q => (q.idx === s.i || (sat.kind === 'train' && q.train === sat.train)) && q.end > now)
    : ((state.evening && state.evening.faint) || []).find(q => q.ai === s.i && q.end > now);
  const up = ((state.now && state.now.list) || []).find(o => o.t === s.t && o.i === s.i);
  return { sat, p, up };
}
function renderDetail(){
  let html, key;
  const next = nextBright();
  if (state.dataError){
    key = 'err';
    html = `<div class="eyebrow">Overhead</div><div class="name">Can't reach the satellite data</div>
      <div class="empty">Check your connection and try again.</div>
      <div class="actions"><button class="btn gold" data-act="reload">Try again</button></div>`;
  } else if (state.sel){
    const { sat, p, up } = selInfo();
    const lbl = up ? up.lbl : p ? chipFor(p) : '';
    key = 'sel' + state.sel.t + state.sel.i + (p ? p.start : 'x') + (up ? 'u' + Math.round(up.az/45) + Math.round(up.el/20) : '');
    html = `<div class="eyebrow"><span>${up ? 'Up there right now' : p ? 'Next time over you' : 'Satellite'}</span>${lbl ? `<span class="${chipCls(lbl)}">${lbl}</span>` : ''}</div>
      <div class="name">${friendly(sat)}</div><div class="empty" style="margin-top:6px">${blurb(sat)}</div>
      ${up ? `<div class="look">${compassSvg(up.az)}<div>Look ${dir(up.az)}, ${height(up.el)}, moving toward the ${dir(up.hd)}</div></div>`
        : p ? passBlock(p) : `<div class="empty" style="color:var(--faint)">${state.obs ? "You won't be able to see this one this evening." : ''}</div>`}
      <div class="actions"><button class="btn slim" data-act="back">Back</button><button class="btn gold" data-act="list">Full list</button></div>`;
  } else if (!state.obs){
    key = 'loc' + state.locError + state.locating;
    html = state.locating
      ? `<div class="eyebrow">Next over you</div><div class="skel" style="width:70%"></div><div class="skel" style="width:45%"></div>`
      : `<div class="eyebrow">Next over you</div><div class="name">Where are you?</div>
        <div class="empty">${state.locError === 'denied'
          ? 'Location is turned off for this page. On iPhone: Settings, Privacy, Location Services, Safari Websites, then allow.'
          : 'Share your location so we can show what flies over you tonight. It stays on your phone.'}</div>
        <div class="actions"><button class="btn gold" data-act="loc">Use my location</button></div>`;
  } else if (!state.passesReady){
    key = 'calc';
    html = `<div class="eyebrow">Next over you</div><div class="skel" style="width:80%"></div><div class="skel" style="width:55%"></div>`;
  } else if (!next){
    key = 'none';
    html = `<div class="eyebrow">Next over you</div><div class="name">Nothing bright in the next day</div>
      <div class="empty">Open the list to see the fainter ones.</div>
      <div class="actions"><button class="btn gold" data-act="list">Full list</button></div>`;
  } else {
    key = 'next' + next.idx + next.start;
    html = `<div class="eyebrow" style="margin-top:2px"><span class="name" style="margin:0;color:var(--ink);letter-spacing:-.2px;text-transform:none">${passName(next)}</span><span class="${chipCls(chipFor(next))}">${chipFor(next)}</span></div>
      ${passBlock(next)}
      <div class="actions"><button class="btn gold" data-act="list">See all ${curated().length} coming up</button></div>`;
  }
  if (key === detailKey) return;
  const first = !detailKey; detailKey = key;
  if (first){ detail.innerHTML = html; measureDetail(); return; }
  detail.classList.add('swap');
  setTimeout(() => { detail.innerHTML = html; detail.classList.remove('swap'); measureDetail(); if (ui.snap === 'half') applyY(snapY('half')); }, 200);
}
function renderBar(){
  let eye = 'Next over you', main = '', sub = '';
  if (state.dataError){ main = "Can't reach the satellite data"; sub = 'Tap to try again'; }
  else if (state.sel){
    const { sat, p, up } = selInfo();
    eye = up ? 'Up right now' : 'Selected';
    main = friendly(sat);
    sub = up ? `Look ${dir(up.az)}, ${height(up.el)}` : p ? `${hmS(p.start)}, ${shortLook(p)}, ${until(p).txt.toLowerCase()}` : 'Not over you this evening';
  } else if (!state.obs){ main = state.locating ? 'Finding where you are' : 'Where are you?'; sub = state.locating ? '' : 'Tap to share your location'; }
  else if (!state.passesReady){ main = "Working out tonight's sky"; }
  else {
    const n = nextBright();
    if (n){ main = `${hmS(n.start)}  ${shortLook(n)}`; sub = `${passName(n)}, ${until(n).txt.toLowerCase()}`; }
    else { main = 'Nothing bright in the next day'; sub = 'Open the list for fainter ones'; }
  }
  $('#barEye').textContent = eye; $('#barMain').textContent = main; $('#barSub').textContent = sub || ' ';
  const chip = $('#nowChip'), now = state.now;
  if (!state.obs){ chip.style.display = 'none'; return; }
  chip.style.display = '';
  chip.classList.toggle('off', !(now && now.dark));
  $('#nowChipTxt').textContent = !now ? 'Right now' : now.dark ? `Right now: ${now.list.length}` : 'Right now';
  $('#tabN').textContent = now && now.dark ? ` ${now.list.length}` : '';
}
detail.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'list') openTab('tonight');
  else if (a === 'back') select(null);
  else if (a === 'loc') askLocation();
  else if (a === 'reload') location.reload();
});
bar.addEventListener('click', e => {
  if (e.target.closest('#nowChip')) return;
  if (!state.obs && !state.locating && ui.snap === 'peek') askLocation();
  if (state.dataError) location.reload();
});

/* ---------- lists ---------- */
function tonightHead(){
  const ev = state.evening;
  if (!state.obs) return '';
  if (state.counting || !ev) return `<div class="head"><div class="lead">Counting tonight's satellites</div><div class="skel" style="width:60%"></div></div>`;
  if (!ev.dark) return `<div class="head"><div class="lead">It won't get dark enough before 10 PM tonight.</div></div>`;
  const tom = new Date(ev.end).toDateString() !== new Date(nowMs()).toDateString();
  const from = ev.start > nowMs() + 60000 ? hm(ev.start).t : null;
  const when = from ? `${tom ? 'Tomorrow night' : 'Tonight'} between ${from} and 10 PM` : 'Between now and 10 PM';
  return `<div class="head"><div class="big">${ev.count}</div><div class="lead">${when}, about <em>${ev.count} satellites</em> will cross your sky.</div>
    <div class="note">Counting the ones you can really spot. Faint ones need dark eyes.</div></div>`;
}
function renderTonight(){
  const now = nowMs(), items = curated();
  const rows = items.map(p => {
    const T = hm(p.start), live = now >= p.start, lbl = chipFor(p);
    const ref = p.ref === 'a' ? `a:${p.ai}` : `m:${p.idx}`;
    return `<button class="row ${live ? 'live' : ''}" data-ref="${ref}"><div class="t">${T.t}<small>${live ? 'UP NOW' : T.ap + ' ' + shortDay(p.start)}</small></div>
      <div><div class="n">${passName(p)}</div><div class="l">${lookWords(p)}</div></div>
      <span class="${chipCls(lbl)}">${lbl}</span></button>`;
  }).join('');
  return tonightHead() + (rows || `<div class="none">${state.obs ? 'Nothing passes over you in the next day.' : 'Share your location to see what flies over you.'}</div>`);
}
function renderNow(){
  const n = state.now;
  if (!state.obs) return `<div class="none">Share your location to see what is up there.</div>`;
  if (!n) return `<div class="head"><div class="lead">Looking up</div><div class="skel" style="width:60%"></div></div>`;
  if (!n.dark) return `<div class="head"><div class="lead">It's still too light out.</div>
    <div class="note">Satellites show up after about ${n.darkAt ? hmS(n.darkAt) : 'dark'}${n.darkAt && new Date(n.darkAt).toDateString() !== new Date(nowMs()).toDateString() ? ' tomorrow' : ''}.</div></div>`;
  const c = { 'Very bright': 0, 'Bright': 0, 'Faint': 0, 'Very faint': 0 };
  n.list.forEach(o => c[o.lbl]++);
  const mix = [['Bright', c['Very bright'] + c['Bright'], 'chip'], ['Faint', c['Faint'], 'chip faint'], ['Very faint', c['Very faint'], 'chip vfaint']]
    .filter(x => x[1]).map(x => `<span class="${x[2]}">${x[1]} ${x[0].toLowerCase()}</span>`).join('');
  const rows = n.list.slice(0, 80).map(o => `<button class="row now" data-ref="${o.t}:${o.i}"><div class="dot ${o.lbl === 'Very faint' ? 'dim' : ''}"></div>
      <div><div class="n">${friendly(o)}</div><div class="l">${dir(o.az)}, ${height(o.el)}, moving toward the ${dir(o.hd)}</div></div>
      <span class="${chipCls(o.lbl)}">${o.lbl}</span></button>`).join('');
  return `<div class="head"><div class="big teal">${n.list.length}</div><div class="lead">${n.list.length === 1 ? 'satellite' : 'satellites'} up there right now</div>
    ${mix ? `<div class="mix">${mix}</div>` : ''}
    <div class="note">Faint ones need dark eyes. Give it 5 minutes away from lights. They glow teal on the globe.</div></div>
    ${rows || `<div class="none">Nothing up there this minute. Check again in a few minutes.</div>`}`;
}
function refreshLists(){
  if (ui.snap !== 'full') return;
  const sc = $('#scroll'), top = sc.scrollTop;
  sc.innerHTML = ui.tab === 'now' ? renderNow() : renderTonight();
  sc.scrollTop = top;
}
$('#scroll').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  const [t, i] = r.dataset.ref.split(':');
  select({ t, i: +i }, true);
  setSnap('half');
});
function refresh(){ recolor(); renderDetail(); renderBar(); refreshLists(); }
function refreshNow(){ renderBar(); if (ui.tab === 'now') refreshLists(); if (state.sel) renderDetail(); }
setInterval(() => {
  const n = $('[data-count]');
  if (n){ const p = state.sel ? selInfo()?.p : nextBright(); if (p){ const u = until(p); n.textContent = u.txt; n.classList.toggle('now', !!u.now); } }
  renderDetail(); renderBar();
}, 1000);

/* ---------- selection / picking ---------- */
function infoFor(t, i){
  if (t === 'm') return state.sats[i];
  const o = ((state.now && state.now.list) || []).find(x => x.t === 'a' && x.i === i)
    || ((state.evening && state.evening.faint) || []).find(x => x.ai === i);
  return o ? { name: o.name, kind: o.kind, year: o.year } : { name: 'Satellite', kind: 'act' };
}
function select(sel, flyThere){
  if (sel) sel.info = infoFor(sel.t, sel.i);
  state.sel = sel;
  pathLine.visible = false;
  if (state.worker) state.worker.postMessage({ type: 'track', i: sel && sel.t === 'a' ? sel.i : -1 });
  if (sel && state.worker){
    state.worker.postMessage({ type: 'path', t: sel.t, idx: sel.i });
    if (flyThere){
      const go = () => { const p = posOf(sel.t, sel.i); if (p) flyTo(new THREE.Vector3(...p), Math.max(1.9, Math.min(camera.position.length(), flyDist())), 2000); };
      posOf(sel.t, sel.i) ? go() : setTimeout(go, 700);
    }
  }
  recolor(); renderDetail(); renderBar();
}
setInterval(() => { if (state.sel && state.worker) state.worker.postMessage({ type: 'path', t: state.sel.t, idx: state.sel.i }); }, 60000);

const tmp = new THREE.Vector3();
function inFront(p){
  const c = camera.position, d = tmp.copy(p).sub(c); const L = d.length(); d.divideScalar(L);
  const b = c.dot(d), disc = b*b - (c.lengthSq() - 1);
  if (disc < 0) return true;
  const t = -b - Math.sqrt(disc);
  return t < 0 || t > L;
}
function toScreen(p){
  const v = p.clone().project(camera);
  return { x: (v.x + 1)/2*window.innerWidth, y: (1 - v.y)/2*window.innerHeight, z: v.z };
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; controls.autoRotate = false; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 8 || dt > 450 || !mainCur) return;
  let best = null, bd = 30;
  const v = new THREE.Vector3();
  const test = (x, y, z, ref) => {
    v.set(x, y, z); if (!x && !y && !z) return;
    const s = toScreen(v); if (s.z > 1) return;
    const d = Math.hypot(s.x - e.clientX, s.y - e.clientY);
    if (d < bd && inFront(v)){ bd = d; best = ref; }
  };
  for (let i = 0; i < state.sats.length; i++) test(mainCur[i*3], mainCur[i*3+1], mainCur[i*3+2], { t: 'm', i });
  trk.cur.forEach((p, i) => test(p[0], p[1], p[2], { t: 'a', i }));
  if (best){ select(best, false); setSnap('half'); }
  else if (ui.snap !== 'peek') setSnap('peek');
  else if (state.sel) select(null);
});

/* ---------- Starlink toggle ---------- */
let slAlpha = 0;
$('#slBtn').onclick = () => {
  state.slOn = !state.slOn;
  $('#slBtn').classList.toggle('on', state.slOn); $('#slBtn').setAttribute('aria-pressed', state.slOn);
  if (state.worker) state.worker.postMessage({ type: 'sl', on: state.slOn });
};

/* ---------- labels ---------- */
const lblIss = $('#lblIss'), lblSel = $('#lblSel'), lblYou = $('#lblYou');
function placeLabel(el, p, show, dy = -22){
  if (!show || !inFront(p)){ el.classList.remove('on'); return; }
  const s = toScreen(p), hw = el.offsetWidth/2 + 10, x = Math.max(hw, Math.min(window.innerWidth - hw, s.x));
  el.style.transform = `translate(${x.toFixed(1)}px, ${(s.y + dy).toFixed(1)}px) translate(-50%, -50%)`;
  el.classList.add('on');
}

/* ---------- reveal ---------- */
let revealed = false, texturesDone = false;
function maybeReveal(force){
  if (revealed || !(force || (texturesDone && state.sats.length))) return;
  revealed = true;
  document.body.classList.add('ready'); $('#stage').classList.add('ready');
  $('#loader').classList.add('hide');
  sheetLayout();
  setTimeout(() => setSnap('peek'), 400);
  if (pendingFly && state.obs){ pendingFly = false; flyTo(ll2v(state.obs.lat, state.obs.lon), flyDist(), 3000); }
}
setTimeout(() => { if (!revealed && texturesDone) maybeReveal(true); }, 12000);

/* ---------- loop ---------- */
let raf = 0, lastSun = 0;
controls.addEventListener('start', () => { dragging = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { dragging = false; idleSince = performance.now(); });
controls.addEventListener('change', () => { idleSince = performance.now(); });
function frame(now){
  raf = requestAnimationFrame(frame);
  if (now - lastSun > 1000){ sun.value.copy(sunVec(nowMs())); lastSun = now; }
  if (mainCur && mainT0){
    const k = Math.min(1, (now - mainT0)/500);
    for (let i = 0; i < mainCur.length; i++) mainCur[i] = mainPrev[i] + (mainNext[i] - mainPrev[i])*k;
    mainGeo.attributes.position.needsUpdate = true;
  }
  stepTrk(now); stepNow();
  if (slPts){
    slAlpha += ((state.slOn && slHasData ? 0.55 : 0) - slAlpha)*0.08;
    slPts.material.uniforms.alpha.value = slAlpha; slPts.visible = slAlpha > 0.01;
    if (slPts.visible && slT0){
      const k = Math.min(1, (now - slT0)/1000);
      for (let i = 0; i < slCur.length; i++) slCur[i] = slPrev[i] + (slNext[i] - slPrev[i])*k;
      slGeo.attributes.position.needsUpdate = true;
    }
  }
  const dist = camera.position.length();
  controls.rotateSpeed = 0.06 + 0.36*Math.min(1, (dist - 1)/(baseDist - 1));
  controls.zoomSpeed = 0.5 + 0.5*Math.min(1, (dist - 1)/(baseDist - 1));
  stepFly(now);
  if (!fly) controls.update();
  stepPatch(now);

  const issI = state.sats.findIndex(s => s.kind === 'iss');
  if (issI >= 0 && mainT0){
    issRing.position.fromArray(mainCur, issI*3); issRing.visible = true;
    const sc = 0.04 + 0.006*Math.sin(now/500); issRing.scale.set(sc, sc, 1);
    placeLabel(lblIss, issRing.position, !(state.sel && state.sel.t === 'm' && state.sel.i === issI));
  }
  const sp = state.sel && posOf(state.sel.t, state.sel.i);
  if (sp){
    selRing.position.set(sp[0], sp[1], sp[2]); selRing.visible = true;
    const sc = 0.055 + 0.01*Math.sin(now/350); selRing.scale.set(sc, sc, 1);
    lblSel.textContent = friendly(state.sel.t === 'm' ? state.sats[state.sel.i] : state.sel.info);
    placeLabel(lblSel, selRing.position, true, -26);
  } else { selRing.visible = false; lblSel.classList.remove('on'); }
  if (pathLine.visible){ pathFade = Math.min(1, pathFade + 0.03); pathLine.material.opacity = pathFade; }
  if (home.visible){
    home.scale.setScalar(Math.max(0.0012, (dist - 1)*0.012 + 0.0006));
    const k = (now % 2200)/2200;
    pulse.scale.setScalar(1 + k*2.2); pulse.material.opacity = 0.8*(1 - k);
    placeLabel(lblYou, home.position, true, -24);
  }
  renderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ cancelAnimationFrame(raf); raf = 0; state.worker && state.worker.postMessage({ type: 'pause', on: true }); }
  else if (!raf){ state.worker && state.worker.postMessage({ type: 'pause', on: false }); raf = requestAnimationFrame(frame); }
});
window.addEventListener('resize', layout);
window.__overhead = { state, texInfo, ui, camera, controls, setSnap };

layout();
refresh();
raf = requestAnimationFrame(frame);
loadEarth();
loadData();
askLocation();
</script>
</body>
</html>
